name: CI

# Valida build/testes/empacotamento. A PUBLICAÇÃO no nuget.org fica no release.yml
# (disparado por tag v*, via Trusted Publishing/OIDC — sem API key de longa duração).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Omni.AutoApi.sln

      # Falha se o código divergir do .editorconfig (rode `dotnet format` localmente).
      - name: Format check
        run: dotnet format Omni.AutoApi.sln --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build Omni.AutoApi.sln -c Release --no-restore

      - name: Test
        run: dotnet test Omni.AutoApi.sln -c Release --no-build

      - name: Pack
        run: dotnet pack Omni.AutoApi.sln -c Release -o artifacts --no-build

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
