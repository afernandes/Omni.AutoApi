name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Omni.AutoApi.sln

      - name: Build
        run: dotnet build Omni.AutoApi.sln -c Release --no-restore

      - name: Test
        run: dotnet test Omni.AutoApi.sln -c Release --no-build

      - name: Pack
        run: dotnet pack Omni.AutoApi.sln -c Release -o artifacts --no-build

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      - name: Publish to NuGet (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
